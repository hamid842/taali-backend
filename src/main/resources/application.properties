# Database Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=password
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/taali_db

# Hibernate Configuration
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.jdbc.timezone=UTC

# JWT Configuration - FIXED
quarkus.smallrye-jwt.enabled=true
smallrye.jwt.sign.key.location=classpath:privateKey.pem
mp.jwt.verify.publickey.location=classpath:publicKey.pem
mp.jwt.verify.issuer=https://taali.com

# Security Configuration - FIXED
quarkus.http.auth.permission.authenticated.paths=/api/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# Public paths that don't require authentication
quarkus.http.auth.permission.public.paths=/api/auth/*,/api/public/*,/api/health/*,/uploads/*,/api/uploads/*,/api/v1/uploads/*
quarkus.http.auth.permission.public.policy=permit

# Internationalization
quarkus.default-locale=en
quarkus.locales=en,fa

# CORS Configuration
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173,http://127.0.0.1:5173,http://[::1]:5173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,accept-language
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.access-control-max-age=3600

quarkus.resteasy-reactive.path=/api

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.taali".level=DEBUG
quarkus.log.category."io.quarkus.smallrye.jwt".level=DEBUG
quarkus.log.category."io.vertx.ext.web.impl.RoutingContext".level=DEBUG

